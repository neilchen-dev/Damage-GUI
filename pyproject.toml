[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "damage-gui"
version = "2.2.0"
description = "基于质心对齐 POD-RBF 降阶代理模型的二维毁伤场快速预测与效能评估系统"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "joblib>=1.3,<2",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0,<7",
]
test = [
    "hypothesis>=6,<7",
    "pytest>=8,<10",
]
web = [
    "fastapi>=0.115,<1",
    "httpx2>=2,<3",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
]
desktop-qt = [
    "PySide6>=6.5,<7",
]

[project.scripts]
damage-gui = "damage_gui.desktop:main"
damage-gui-cli = "damage_gui.cli:main"
damage-gui-web = "damage_gui.webapp.app:main"
damage-gui-qt = "damage_gui.qt.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
damage_gui = [
    "qt/icons/*.svg",
    "gui/assets/*.ico",
    "gui/assets/*.png",
    "webapp/static/*.html",
    "webapp/static/*.css",
    "webapp/static/*.js",
    "webapp/static/assets/*.png",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]
extend-exclude = ["build", "dist", "release", ".codebuddy"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "UP",  # pyupgrade（目标 py310 语法）
    "B",   # bugbear 常见陷阱
]

[tool.ruff.lint.per-file-ignores]
# 脚本与测试需要先把 src 注入 sys.path 再导入项目包
"scripts/*.py" = ["E402"]
# Qt 重构阶段代码采用紧凑单行风格（发布阶段不做大范围重排，仅保证
# 语义类规则 F/B/I/UP 全部通过）
"src/damage_gui/qt/*" = ["E501", "E701", "E702", "E402"]
"scripts/capture_qt_*.py" = ["E501", "E701", "E702"]
"scripts/qt_release_acceptance.py" = ["E501"]
"tests/test_qt_*.py" = ["E501", "E701", "E702"]
"tests/test_training_registry.py" = ["E501", "E701", "E702"]
"tests/test_validation_service.py" = ["E701"]
"tests/test_validation_storage_migration.py" = ["E701"]
"tests/*.py" = ["E402"]