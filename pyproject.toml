[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "damage-gui"
version = "2.2.0"
description = "基于POD-RBF代理模型的弹药毁伤智能化快速评估系统"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "joblib>=1.3,<2",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
# 最小核心（CLI / 库调用 / headless server 启动都能拉起）：
# 无 sklearn、无 pandas、无 GUI 框架。可作为 Docker / serverless 入口。
core = [
    "joblib>=1.3,<2",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
]
# 桌面 UI：PySide6（Qt 桌面）
desktop = [
    "damage-gui[core]",
    "PySide6>=6.5,<6.12",
]
# Web 工作台（FastAPI）
web = [
    "damage-gui[core]",
    "fastapi>=0.115,<1",
    "httpx2>=2,<3",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
]
# 桌面 + Web 的合并安装（PyInstaller 发布用）—— 不再含 sklearn / pandas。
full = [
    "damage-gui[desktop]",
    "damage-gui[web]",
]
# 数据科学（scripts/ 下研究脚本用）：
#   - pandas  : 研究脚本与部分测试的参照实现（交叉验证 Table 输出）
#   - scikit-learn: ablation_study / calibrate_ood 的 train_test_split
# src/ 树（含 experiments 包）已零 pandas / 零 sklearn。
data-science = [
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
]
# 旧 joblib 模型反序列化所需的依赖：
#   - scikit-learn: v2.2 POD 模型内嵌 sklearn PCA 对象（pca 属性，
#     加载后由 PODRBFDamageField.__setstate__ 迁移为 pod）
#   - pandas      : 旧 ModelBundle 的 accuracy/condition 报告是 pd.DataFrame
# 加载旧模型报 "依赖缺失模块: sklearn/pandas" 时安装本 extra。
legacy = [
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
]
build = [
    "pyinstaller>=6.0,<7",
]
test = [
    "hypothesis>=6,<7",
    "pytest>=8,<10",
]

[project.scripts]
# 默认入口：Qt 桌面（2.2+ 主线）。完整依赖见 extras `full`。
damage-gui = "damage_gui.desktop:main"
damage-gui-cli = "damage_gui.cli:main"
damage-gui-web = "damage_gui.webapp.app:main"
damage-gui-qt = "damage_gui.qt.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
damage_gui = [
    "qt/icons/*.svg",
    "runtime/assets/*.ico",
    "runtime/assets/*.png",
    "webapp/static/*.html",
    "webapp/static/*.css",
    "webapp/static/*.js",
    "webapp/static/assets/*.png",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]
extend-exclude = ["build", "dist", "release", ".codebuddy"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "UP",  # pyupgrade（目标 py310 语法）
    "B",   # bugbear 常见陷阱
]

[tool.ruff.lint.per-file-ignores]
# scripts 与测试需要先把 src 注入 sys.path 再导入项目包
"scripts/*.py" = ["E402"]
"scripts/archive/*.py" = ["E402"]
# app.py 与 experiments/__init__.py 的 TYPE_CHECKING 导入块是历史符号声明：
# 运行时由 __getattr__ 惰性解析，静态上确实未被直接引用。
"src/damage_gui/app.py" = ["F401"]
"src/damage_gui/experiments/__init__.py" = ["F401"]
# data/table.py 与 tests/test_table.py 中存在跨表/列长度的 zip：
# 例如 ``zip(self._rows, mask)`` 在 mask 长度短于行数时按 pandas 语义仅迭代
# 到 mask 结尾，强制 strict 会与 pandas 行为不一致。
"src/damage_gui/data/table.py" = ["B905"]
"tests/test_table.py" = ["B905"]
# Qt 重构阶段代码采用紧凑单行风格（发布阶段不做大范围重排，仅保证
# 语义类规则 F/B/I/UP 全部通过）
"src/damage_gui/qt/*" = ["E501", "E701", "E702", "E402"]
"scripts/archive/capture_qt_*.py" = ["E501", "E701", "E702"]
"scripts/archive/capture_*.py" = ["E501", "E701", "E702"]
"scripts/archive/qt_release_acceptance.py" = ["E501"]
"tests/test_qt_*.py" = ["E501", "E701", "E702"]
"tests/test_training_registry.py" = ["E501", "E701", "E702"]
"tests/test_validation_service.py" = ["E701"]
"tests/test_validation_storage_migration.py" = ["E701"]
"tests/*.py" = ["E402"]
