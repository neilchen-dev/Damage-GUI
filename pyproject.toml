[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "damage-gui"
version = "2.1.0"
description = "基于质心对齐 POD-RBF 降阶代理模型的二维毁伤场快速预测与效能评估系统"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "joblib>=1.3,<2",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0,<7",
]
web = [
    "fastapi>=0.115,<1",
    "httpx2>=2,<3",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
damage-gui = "damage_gui.desktop:main"
damage-gui-cli = "damage_gui.cli:main"
damage-gui-web = "damage_gui.webapp.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
damage_gui = [
    "gui/assets/*.ico",
    "gui/assets/*.png",
    "webapp/static/*.html",
    "webapp/static/*.css",
    "webapp/static/*.js",
    "webapp/static/assets/*.png",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]
extend-exclude = ["build", "dist", "release", ".codebuddy"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "UP",  # pyupgrade（目标 py310 语法）
    "B",   # bugbear 常见陷阱
]

[tool.ruff.lint.per-file-ignores]
# 脚本与测试需要先把 src 注入 sys.path 再导入项目包
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
