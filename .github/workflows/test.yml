name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Web tests are optional for the desktop runtime but are part of CI.
      # Hypothesis property-based tests (tests/test_properties.py) require the
      # [test] extra, which is not part of the runtime requirements.txt.
      - name: Install optional Web and test dependencies
        run: pip install -e ".[web,test]"

      # 含单元测试与数值回归测试（Windows/Linux 双平台黄金值对比）
      - name: Run unit and numerical regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  build:
    name: Windows PyInstaller build
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt "pyinstaller>=6.0,<7"

      - name: Build Windows release package
        shell: cmd
        run: scripts\build_release.bat

      - name: Verify executable artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Recurse -Filter "*.exe" |
            Select-Object -First 1
          if (-not $exe) {
            Write-Error "PyInstaller build produced no .exe artifact"
            exit 1
          }
          Write-Host "Built executable: $($exe.FullName)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Damage-GUI-win64
          path: release/
          if-no-files-found: error

  release:
    # 仅 tag 推送时把构建产物挂到 GitHub Release；普通 push/PR 只留 artifact
    name: Attach release (tags only)
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Damage-GUI-win64
          path: release

      - name: Zip release package
        run: |
          cd release
          zip -r ../Damage-GUI-win64.zip .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Damage-GUI-win64.zip
